    <!--
        CodePen — isometric 3D box, drawn as filled faces like the real logo.
        Three faces: top (lighter), left (medium), right (darkest via opacity).
        Uses filled polygons with opacity so the face distinction reads at small sizes.
        viewBox 0 0 100 100 for clean integer coords, scales to any size.
        Top face:      12,2  →  21,7  →  12,12  →  3,7
        Left face:     3,7   →  12,12 →  12,22  →  3,17
        Right face:    21,7  →  21,17 →  12,22  →  12,12
        Outline hex:   12,2 21,7 21,17 12,22 3,17 3,7
    -->
    <symbol id="ic-codepen" viewBox="0 0 24 24">
        <!-- top face -->
        <polygon points="12,2 21,7 12,12 3,7" fill="currentColor" opacity="1" />
        <!-- left face -->
        <polygon
            points="3,7 12,12 12,22 3,17"
            fill="currentColor"
            opacity="0.55"
        />
        <!-- right face -->
        <polygon
            points="21,7 21,17 12,22 12,12"
            fill="currentColor"
            opacity="0.3"
        />
        <!-- crisp outline stroke on top of fills -->
        <polygon
            points="12,2 21,7 21,17 12,22 3,17 3,7"
            fill="none"
            stroke="currentColor"
            stroke-width="0.7"
            stroke-linejoin="round"
            opacity="0.6"
        />
        <line
            x1="12"
            y1="2"
            x2="12"
            y2="12"
            stroke="currentColor"
            stroke-width="0.7"
            opacity="0.6"
        />
        <line
            x1="3"
            y1="7"
            x2="12"
            y2="12"
            stroke="currentColor"
            stroke-width="0.7"
            opacity="0.6"
        />
        <line
            x1="21"
            y1="7"
            x2="12"
            y2="12"
            stroke="currentColor"
            stroke-width="0.7"
            opacity="0.6"
        />
        <line
            x1="3"
            y1="12"
            x2="21"
            y2="12"
            stroke="currentColor"
            stroke-width="0.7"
            opacity="0.6"
        />
    </symbol>
    <!--
        Contra — 4-pointed sparkle with triangular arms.
        Each arm: two straight lines from center to outer tip, with the
        wide base side bowed outward (one curved side, one curved side).
        Built as 4 solid triangular wedges + concave cutouts for the
        "broad curved base pointing outward" look from the logo.
        Each arm is: center (12,12) → left-shoulder → tip → right-shoulder → back.
        North arm tip: 12,1.5  shoulders at ~9,9 and ~15,9
        East  arm tip: 22.5,12 shoulders at ~15,9 and ~15,15
        South arm tip: 12,22.5 shoulders at ~15,15 and ~9,15
        West  arm tip: 1.5,12  shoulders at ~9,15 and ~9,9
        Concave sides via quadratic bezier curving inward toward center.
    -->
    <symbol id="ic-contra" viewBox="0 0 24 24">
        <path
            fill="currentColor"
            d="
            M12,12 Q9,9.5 9,9 L12,1.5 L15,9 Q15,9.5 12,12 Z
            M12,12 Q14.5,9 15,9 L22.5,12 L15,15 Q14.5,15 12,12 Z
            M12,12 Q15,14.5 15,15 L12,22.5 L9,15 Q9,14.5 12,12 Z
            M12,12 Q9.5,15 9,15 L1.5,12 L9,9 Q9.5,9 12,12 Z
        "
        />
    </symbol>

    <!--
        Blog — 📄 page emoji style:
        White sheet with top-right corner folded down, ruled lines inside.
        Sheet body: rect with top-right corner cut (polygon).
        Dog-ear triangle top-right.
        Three text lines.
    -->
    <symbol id="ic-blog" viewBox="0 0 24 24">
        <!-- Sheet body — top-right corner folded: TL→TR-fold→fold-point→BR→BL -->
        <polygon
            points="4,2 16,2 16,7 20,7 20,22 4,22"
            fill="currentColor"
            opacity="0.9"

        <!-- Fold flap triangle -->

        <!-- Fold crease line -->
        <polyline
            points="16,2 20,7 16,7"
            fill="none"
            stroke="white"
            stroke-width="0.6"
            opacity="0.7"
